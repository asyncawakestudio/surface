# Production stack: distroless Go server serving both the API and the built
# client. Uses a raw half-open SYN port scan, which requires host networking
# (no bridge NAT) + NET_RAW. Deploy on a Linux host such as an EC2 instance in
# a PUBLIC subnet (a NAT gateway re-introduces the SNAT that breaks SYN, and
# Fargate/Docker Desktop can't do real host networking or raw sockets).
#   docker compose -f devops/compose.prod.yaml up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: surface
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surface}
      POSTGRES_DB: surface
    # Published on loopback so the host-networked server can reach it; not
    # exposed off-box.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surface -d surface"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: surface-cloud/devops/server.Dockerfile
      target: prod
    # Host networking: no bridge SNAT, so raw SYN replies return to naabu's
    # capture. The server listens on the host's :8080 directly (no ports map).
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      PORT: "8080"
      # Host networking: reach Postgres on loopback, not the compose service name.
      DATABASE_URL: postgres://surface:${POSTGRES_PASSWORD:-surface}@127.0.0.1:5432/surface?sslmode=disable
      SUBFINDER_PROVIDER_CONFIG: /config/subfinder/provider-config.yaml
      # Optional ipinfo.io token (set in your shell or devops/.env).
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      PORT_SCAN: ${PORT_SCAN:-true}
      # Half-open SYN scan in production. Set PORT_SCAN_TYPE=connect if the host
      # is behind a NAT (e.g. a private subnet via a NAT gateway), where SYN
      # replies don't return.
      PORT_SCAN_TYPE: ${PORT_SCAN_TYPE:-syn}
      # Scan speed: packets/sec (higher = faster SYN scan), retry passes, and
      # port spec ("-" = all 65535). Raise the rate to scan all ports faster.
      PORT_SCAN_RATE: ${PORT_SCAN_RATE:-5000}
      PORT_SCAN_RETRIES: ${PORT_SCAN_RETRIES:-2}
      PORT_SCAN_PORTS: ${PORT_SCAN_PORTS:--}
    volumes:
      - ./config:/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
