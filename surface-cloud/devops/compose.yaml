# Development stack: Postgres + Go API (air hot reload) + Vite dev server (HMR).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: surface
      POSTGRES_PASSWORD: surface
      POSTGRES_DB: surface
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surface -d surface"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Dev mail catcher: accepts all SMTP and shows it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: surface-cloud/devops/server.Dockerfile
      target: dev
    # Raw-socket caps so naabu performs a half-open SYN scan; without them it
    # falls back to a TCP connect scan.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://surface:surface@db:5432/surface?sslmode=disable
      # Mount a subfinder provider-config.yaml here to enable API-key sources.
      SUBFINDER_PROVIDER_CONFIG: /config/subfinder/provider-config.yaml
      # Optional ipinfo.io token (set in your shell or devops/.env).
      IPINFO_TOKEN: ${IPINFO_TOKEN:-}
      # Port scanning (naabu). Set PORT_SCAN=false to skip the stage.
      PORT_SCAN: ${PORT_SCAN:-true}
      # Scan mode: "connect" (full TCP connect) works through the Docker bridge
      # NAT; a raw "syn" scan sends packets but its replies don't return through
      # the bridge/WSL2 NAT, so it reports zero open ports here. Use "syn" only
      # with host networking or on bare metal.
      PORT_SCAN_TYPE: ${PORT_SCAN_TYPE:-connect}
      # Scan speed: packets/sec (higher = faster SYN scan), retry passes, and
      # port spec ("-" = all 65535). Raise the rate to scan all ports faster.
      PORT_SCAN_RATE: ${PORT_SCAN_RATE:-5000}
      PORT_SCAN_RETRIES: ${PORT_SCAN_RETRIES:-2}
      PORT_SCAN_PORTS: ${PORT_SCAN_PORTS:--}
      # --- Email OTP login ---
      # Dev defaults to the local Mailpit catcher (see the `mailpit` service):
      # every login email is captured and viewable at http://localhost:8025 —
      # nothing leaves your machine. Override via devops/.env to use a real
      # provider (e.g. Mailtrap/Mailjet).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@surface.local}
      SMTP_TLS: ${SMTP_TLS:-none}
      COOKIE_SECURE: "false"
      APP_NAME: Surface
    ports:
      - "8080:8080"
    working_dir: /src/surface-cloud/server
    volumes:
      - ../../surface:/src/surface
      - ../server:/src/surface-cloud/server
      - ./config:/config:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # The first boot compiles the whole dependency tree, which can take a few
    # minutes; the client waits for this instead of logging proxy errors.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      start_period: 10m
      start_interval: 3s
      interval: 30s
      timeout: 3s
      retries: 3

  client:
    build:
      context: ../..
      dockerfile: surface-cloud/devops/client.Dockerfile
    environment:
      API_URL: http://server:8080
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ../client:/app
      - /app/node_modules
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  go-mod-cache:
  go-build-cache:
