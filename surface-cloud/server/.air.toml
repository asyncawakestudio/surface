root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "vendor", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  # Bind-mounted files on Docker Desktop / WSL2 don't always emit inotify
  # events, so poll for changes instead.
  poll = true
  poll_interval = 500

[log]
  time = false

[misc]
  clean_on_exit = true
