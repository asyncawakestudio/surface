# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: surface

before:
  hooks:
    - go mod download

builds:
  - id: surface
    main: ./cmd/surface
    binary: surface
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: surface-mcp
    main: ./cmd/surface-mcp
    binary: surface-mcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.serverVersion={{ .Version }}

archives:
  - id: default
    ids: [surface, surface-mcp]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

# Release notes come from release-please; GoReleaser only uploads artifacts.
changelog:
  disable: true

release:
  mode: keep-existing
  prerelease: auto
